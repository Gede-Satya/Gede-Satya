name: Generate Contribution Animation

on:
  # Jalankan otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *"
  # Memungkinkan kita menjalankan script secara manual
  workflow_dispatch:
  # Jalankan setiap ada perubahan di branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Men-generate animasi dari data kontribusi Github-mu
      - name: Generate Contribution Graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Menyimpan file SVG ke branch 'pacman-output'
      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
